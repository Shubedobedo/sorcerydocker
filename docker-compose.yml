services:
  sorcery:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - sorcery-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/sorcery.db
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
    restart: unless-stopped

volumes:
  sorcery-data:
